<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MIXSABOR | Sabores que se encuentran</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Tartas personalizadas, platos cubanos y españoles, dulces y encargos para celebraciones, con entrega local o recogida." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8f5eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MIXSABOR" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="google-site-verification" content="mN9Kn5wyUl7DOw7Gq2H9vdg89IDvZ8X2KYf9_o__ufs" />
    <link rel="icon" type="image/png" sizes="232x232" href="/assets/branding/favicon_mixsabor_dark.png" />
    <link rel="apple-touch-icon" href="/assets/branding/pwa-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        let theme;
        try {
          const stored = localStorage.getItem('theme-mode');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch {}
        if (!theme) theme = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        const bg = theme === 'dark' ? '#111827' : '#f8f5eb';
        root.style.backgroundColor = bg;
        const meta = document.querySelector && document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      })();
    </script>
    <style>
      html, body { margin: 0; background-color: #f8f5eb; }
      html[data-theme='dark'], html[data-theme='dark'] body { background-color: #111827; }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #f8f5eb;
        opacity: 1;
        visibility: visible;
        transition: opacity 280ms ease, visibility 0s linear 280ms;
      }
      html[data-theme='dark'] #app-splash { background: #111827; }
      #app-splash.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
      #app-splash-logo { display: block; width: min(68vw, 340px); max-height: min(58vh, 440px); height: auto; object-fit: contain; }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition: none; }
      }
    </style>
    <link rel="canonical" href="https://mixsabor.milugui.com/" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="MIXSABOR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MIXSABOR | Sabores que se encuentran" />
    <meta property="og:description" content="Tartas personalizadas, platos cubanos y españoles, dulces y encargos para celebraciones, con entrega local o recogida." />
    <meta property="og:url" content="https://mixsabor.milugui.com/" />
    <meta property="og:image" content="https://mixsabor.milugui.com/assets/branding/logo_mixsabor_dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MIXSABOR | Sabores que se encuentran" />
    <meta name="twitter:description" content="Tartas personalizadas, platos cubanos y españoles, dulces y encargos para celebraciones, con entrega local o recogida." />
    <meta name="twitter:image" content="https://mixsabor.milugui.com/assets/branding/logo_mixsabor_dark.png" />
  </head>
  <body>
    <app-root></app-root>
    <div id="app-splash" role="status" aria-label="Cargando MIXSABOR">
      <img id="app-splash-logo" alt="MIXSABOR" width="1254" height="1254" />
    </div>
    <script>
      (() => {
        const root = document.querySelector('app-root');
        const splash = document.getElementById('app-splash');
        const logo = document.getElementById('app-splash-logo');
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        logo.src = dark
          ? '/assets/branding/logo_mixsabor_dark.png'
          : '/assets/branding/logo_mixsabor_light.png';

        const revealApp = () => {
          if (!root?.children.length) return;
          requestAnimationFrame(() => requestAnimationFrame(() => splash?.classList.add('is-ready')));
          const reduceMotion = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
          setTimeout(() => splash?.remove(), reduceMotion ? 0 : 320);
          observer.disconnect();
        };
        const observer = new MutationObserver(revealApp);
        if (root) observer.observe(root, { childList: true });
        revealApp();
      })();
    </script>
  </body>
</html>
