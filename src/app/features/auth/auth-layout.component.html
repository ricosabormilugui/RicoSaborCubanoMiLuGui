<section
  class="auth-shell"
  [class.is-engaged]="engaged()"
  (focusin)="onFormFocusIn()"
  (focusout)="onFormFocusOut($event)">
  <aside
    *ngIf="showVisual()"
    class="auth-visual"
    (pointermove)="onVisualMove($event)"
    (pointerleave)="onVisualLeave($event)">
    <app-auth-visual-stage
      [state]="stageState()"
      [successKind]="successKind()"
      [logoSrc]="brandLogo()"
      [brandName]="brand.name" />
  </aside>

  <div class="auth-panel">
    <div class="auth-form-wrap">
      <a class="auth-brand" routerLink="/" [attr.aria-label]="brand.name">
        <img [src]="brandLogo()" [alt]="brand.name" width="96" height="96" />
      </a>
      <div class="auth-reveal">
        <header class="auth-head">
          <h1>{{ title() }}</h1>
          <p *ngIf="subtitle()">{{ subtitle() }}</p>
        </header>
        <ng-content />
      </div>
    </div>
  </div>
</section>
