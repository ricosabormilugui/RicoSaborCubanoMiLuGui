[build]
  base = "."
  command = "npm run build"
  publish = "dist/ricosabor-tienda/browser"

[build.environment]
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"
  NPM_CONFIG_FETCH_RETRIES = "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR = "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT = "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT = "120000"

# Un branch deploy llamado `staging` genera un artefacto no indexable y marcado.
# En un sitio Netlify separado cuya rama principal sea staging, configure este
# mismo comando manualmente porque ese despliegue usa el contexto `production`.
[context.staging]
  command = "npm run build:staging"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "https://ricosaborcubano.netlify.app/*"
  to = "https://mixsabor.milugui.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api-proxy/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/branding/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
